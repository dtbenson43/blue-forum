<!doctype html>
<html lang="en" data-webtui-theme="hotline">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLUE FORUM — GENERAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/vendor/webtui.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="top" box-="square">
        <div class="brand-row">
          <h1>blue forum</h1>
          <span is-="badge">general</span>
        </div>
        <p class="tagline">
          do you like hurting other people? · nah · just threading · leave a message
        </p>
        <form id="rename-form" class="rename" autocomplete="off">
          <label>
            identity
            <input
              id="display-name"
              type="text"
              maxlength="40"
              placeholder="loading…"
              required
            />
          </label>
          <button type="submit" variant-="foreground0">rename</button>
          <span id="rename-status" class="status" aria-live="polite"></span>
        </form>
      </header>

      <section id="board-view">
        <section class="compose" box-="square">
          <h2>new thread</h2>
          <form id="thread-form" autocomplete="off">
            <label>
              subject
              <input id="thread-title" type="text" maxlength="120" required />
            </label>
            <label>
              opening message
              <textarea id="thread-body" rows="5" maxlength="5000" required></textarea>
            </label>
            <div class="row">
              <button type="submit" variant-="foreground0">start thread</button>
              <span id="thread-status" class="status" aria-live="polite"></span>
            </div>
          </form>
        </section>

        <section class="feed" box-="square">
          <div class="feed-head">
            <h2>threads</h2>
            <button id="refresh" type="button" variant-="foreground2">refresh</button>
          </div>
          <div id="thread-list" class="posts">
            <p class="muted">waiting for the call…</p>
          </div>
        </section>
      </section>

      <section id="thread-view" class="hidden">
        <section class="feed" box-="square">
          <div class="feed-head">
            <button id="back-board" type="button" variant-="foreground2">← general</button>
            <button id="refresh-thread" type="button" variant-="foreground2">refresh</button>
          </div>
          <div id="thread-detail">
            <p class="muted">loading thread…</p>
          </div>
        </section>

        <section class="compose" box-="square">
          <h2>reply</h2>
          <form id="reply-form" autocomplete="off">
            <label>
              message
              <textarea id="reply-body" rows="4" maxlength="5000" required></textarea>
            </label>
            <div class="row">
              <button type="submit" variant-="foreground0">send reply</button>
              <span id="reply-status" class="status" aria-live="polite"></span>
            </div>
          </form>
        </section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
