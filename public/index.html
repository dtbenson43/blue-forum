<!doctype html>
<html lang="en" data-webtui-theme="hotline">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLUE FORUM — GENERAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/vendor/webtui.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="top" box-="square">
        <div class="brand-row">
          <h1>blue forum</h1>
          <span is-="badge">general</span>
        </div>
        <p class="tagline">
          do you like hurting other people? · nah · just posting · leave a message
        </p>
        <form id="rename-form" class="rename" autocomplete="off">
          <label>
            identity
            <input
              id="display-name"
              type="text"
              maxlength="40"
              placeholder="loading…"
              required
            />
          </label>
          <button type="submit" variant-="foreground0">rename</button>
          <span id="rename-status" class="status" aria-live="polite"></span>
        </form>
      </header>

      <section class="compose" box-="square">
        <h2>new transmission</h2>
        <form id="post-form" autocomplete="off">
          <label>
            subject
            <input id="post-title" type="text" maxlength="120" required />
          </label>
          <label>
            message
            <textarea id="post-body" rows="5" maxlength="5000" required></textarea>
          </label>
          <div class="row">
            <button type="submit" variant-="foreground0">send to general</button>
            <span id="post-status" class="status" aria-live="polite"></span>
          </div>
        </form>
      </section>

      <section class="feed" box-="square">
        <div class="feed-head">
          <h2>tape log</h2>
          <button id="refresh" type="button" variant-="foreground2">refresh</button>
        </div>
        <div id="posts" class="posts">
          <p class="muted">waiting for the call…</p>
        </div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
